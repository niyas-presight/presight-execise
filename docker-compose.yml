services:
  server:
    build:
      context: .
      target: server
    image: presight-user-directory-server
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      - app-data:/app/data

  client:
    build:
      context: .
      target: client
    image: presight-user-directory-client
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server

volumes:
  app-data: